<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #222;
    }

    .calculator {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #4f46e5;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      color: #777;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #444;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 15px 55px 15px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.3s ease;
    }

    .input-wrapper input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 5px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 22px;
      text-align: center;
      border-radius: 16px;
      background: #f8f9ff;
    }

    .result.show {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .bmi-value {
      font-size: 42px;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 5px;
    }

    .category {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
    }

    .underweight {
      color: #2563eb;
      background: #dbeafe;
    }

    .normal {
      color: #15803d;
      background: #dcfce7;
    }

    .overweight {
      color: #dc2626;
      background: #fee2e2;
    }

    .error {
      margin-top: 12px;
      color: #dc2626;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .calculator {
        padding: 25px 20px;
      }

      .header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">
    <div class="header">
      <h1>BMI Calculator</h1>
      <p>Calculate your Body Mass Index</p>
    </div>

    <div class="input-group">
      <label for="weight">Weight</label>
      <div class="input-wrapper">
        <input
          type="number"
          id="weight"
          placeholder="Enter your weight"
          min="1"
          step="0.1"
        />
        <span class="unit">kg</span>
      </div>
    </div>

    <div class="input-group">
      <label for="height">Height</label>
      <div class="input-wrapper">
        <input
          type="number"
          id="height"
          placeholder="Enter your height"
          min="1"
          step="0.1"
        />
        <span class="unit">cm</span>
      </div>
    </div>

    <button id="calculateBtn">Calculate BMI</button>

    <div class="error" id="error">
      Please enter a valid weight and height.
    </div>

    <div class="result" id="result">
      <div class="bmi-value" id="bmiValue">--</div>
      <div class="category" id="category">--</div>
    </div>
  </main>

  <script>
    const weightInput = document.getElementById("weight");
    const heightInput = document.getElementById("height");
    const calculateBtn = document.getElementById("calculateBtn");
    const result = document.getElementById("result");
    const bmiValue = document.getElementById("bmiValue");
    const category = document.getElementById("category");
    const error = document.getElementById("error");

    function calculateBMI() {
      const weight = parseFloat(weightInput.value);
      const heightCm = parseFloat(heightInput.value);

      // Reset previous error
      error.style.display = "none";

      if (
        isNaN(weight) ||
        isNaN(heightCm) ||
        weight <= 0 ||
        heightCm <= 0
      ) {
        result.classList.remove("show");
        error.style.display = "block";
        return;
      }

      // Convert height from centimeters to meters
      const heightM = heightCm / 100;

      // BMI formula
      const bmi = weight / (heightM * heightM);

      bmiValue.textContent = bmi.toFixed(1);

      // Reset category classes
      category.className = "category";

      if (bmi < 18.5) {
        category.textContent = "Underweight";
        category.classList.add("underweight");
      } else if (bmi < 25) {
        category.textContent = "Normal";
        category.classList.add("normal");
      } else {
        category.textContent = "Overweight";
        category.classList.add("overweight");
      }

      result.classList.add("show");
    }

    calculateBtn.addEventListener("click", calculateBMI);

    // Allow pressing Enter to calculate
    [weightInput, heightInput].forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          calculateBMI();
        }
      });
    });
  </script>

</body>
</html>
